<svg width="760" height="250" viewBox="0 0 760 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="0.5" y="0.5" width="759" height="249" rx="10" fill="#0a0e14" stroke="#30363d"/>
  <path d="M0.5,10 A9.5,9.5 0 0 1 10,0.5 H750 A9.5,9.5 0 0 1 759.5,10 V38 H0.5 Z" fill="#161b22" stroke="#30363d"/>
  <circle cx="21" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="43" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="19" r="6" fill="#27c93f"/>
  <text x="380" y="24" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="13" fill="#8b949e">yogesh@github:~</text>

  <g id="l1" opacity="0">
    <text x="30" y="78" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="19">
      <tspan fill="#7ee787">&#10095; </tspan><tspan fill="#e6edf3">whoami</tspan>
    </text>
    <animate id="l1anim" attributeName="opacity" from="0" to="1" dur="0.4s" begin="0s;l4anim.end+2.5s" fill="freeze"/>
  </g>

  <g id="l2" opacity="0">
    <text x="30" y="113" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="19" fill="#79c0ff">
