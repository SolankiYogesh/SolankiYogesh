    <animate id="l5anim" attributeName="opacity" from="0" to="1" dur="0.3s" begin="l4anim.end+0.4s" fill="freeze"/>
  </g>

  <rect x="48" y="207" width="10" height="20" fill="#e6edf3">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="l5anim.end" repeatCount="indefinite"/>
  </rect>
