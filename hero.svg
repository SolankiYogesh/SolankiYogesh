    </text>
    <animate id="l2anim" attributeName="opacity" from="0" to="1" dur="0.4s" begin="l1anim.end+0.5s" fill="freeze"/>
  </g>

  <g id="l3" opacity="0">
    <text x="30" y="148" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="19">
      <tspan fill="#7ee787">&#10095; </tspan><tspan fill="#e6edf3">cat ~/focus.json</tspan>
    </text>
    <animate id="l3anim" attributeName="opacity" from="0" to="1" dur="0.4s" begin="l2anim.end+0.5s" fill="freeze"/>
  </g>

  <g id="l4" opacity="0">
